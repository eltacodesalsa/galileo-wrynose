# ── Gestor de arranque: DEBE ir antes del require ────────────────────────────
# poky.conf -> defaultsetup.conf hace  INIT_MANAGER ??= "none"  y elige el init
# en ese momento. Poniendolo despues del require llega tarde y el build sale con
# sysvinit; entonces systemd.bbclass ejecuta rm_systemd_unitdir, borra las
# unidades y paquetes como galileo-watchdog se quedan vacios ("Unable to find a
# match"). Medido dos veces.
INIT_MANAGER = "systemd"

# Distro propia: es lo que pone el nombre visible en la placa.
#
# os-release deriva de aquí:
#   NAME        = DISTRO_NAME
#   VERSION     = DISTRO_VERSION
#   ID          = DISTRO
#   PRETTY_NAME = "${DISTRO_NAME} ${DISTRO_VERSION}"
#
# OJO: esto cambia SOLO los textos del sistema de archivos. Los strings DMI/ACPI
# del firmware ("Intel Corp. QUARK/GalileoGen2") NO se tocan: son read-only y los
# drivers (stmmac ethernet, 8250_exar serie, intel_quark_i2c_gpio, gpio-sch) hacen
# match contra ellos para habilitar el hardware. Renombrarlos deja la placa sin
# ethernet, sin serie y sin GPIO, y muda.

require conf/distro/poky.conf

DISTRO = "galileo-wrynose"
DISTRO_NAME = "Galileo Wrynose"
DISTRO_VERSION = "0.1"
DISTRO_CODENAME = "wrynose"

MAINTAINER = "José"

# El rootfs del vendor usaba sysvinit; sistema con 192 MB de RAM.
# Cambiar a systemd es una decisión aparte, y se mide antes de prometerla.
INIT_MANAGER = "sysvinit"

# Imagen sin credenciales vacías: nada de root sin contraseña en una release.
# La provisión de acceso es por clave SSH en el primer arranque.
EXTRA_IMAGE_FEATURES += "ssh-server-openssh"

# El gestor de arranque se declara con el include OFICIAL, que deja coherentes
# DISTRO_FEATURES, VIRTUAL-RUNTIME_init_manager e initscripts a la vez. Hacerlo a
# mano con DISTRO_FEATURES:append provoca "VIRTUAL-RUNTIME_init_manager (sysvinit)
# does not match DISTRO_FEATURES".
require conf/distro/include/init-manager-systemd.inc
