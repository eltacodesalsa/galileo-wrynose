#@TYPE: Machine
#@NAME: iot2000
#@DESCRIPTION: SIMATIC IOT2000 / Intel Galileo Gen 2 (Intel Quark X1000, x86 32-bit)
#
# Ported from meta-iot2000-bsp (Siemens AG) to Yocto 6.0 "wrynose".
# The DMI/ACPI strings ("SIMATIC IOT2000") MUST NOT be renamed: ethernet,
# serial and GPIO depend on them.

MACHINEOVERRIDES =. "intel-quark:"

# linux-yocto on 6.0; the vendor used linux-cip (4.4) which no longer exists.
PREFERRED_PROVIDER_virtual/kernel ?= "linux-yocto"

require conf/machine/include/intel-quark-common.inc

MACHINE_FEATURES = "efi usb"

MACHINE_EXTRA_RRECOMMENDS += "kernel-modules"

SERIAL_CONSOLES = "115200;ttyS1"
APPEND += "rootwait console=ttyS1,115200 console=tty0"

# A/B boot via EFI Boot Guard (two 32 MB config partitions: boot0 + boot1)
EFI_PROVIDER = "efibootguard"
WKS_FILE ?= "iot2000-ab.wks"

# Quark errata: the LOCK prefix (#AC) is not allowed. The vendor did it with
# EXTRA_CFLAGS; on modern Kbuild that is deprecated, so KCFLAGS/KAFLAGS are used.
# Acceptance criterion is objdump on vmlinux, not a grep of this recipe.
KCFLAGS:append = " -Wa,-momit-lock-prefix=yes"
KAFLAGS:append = " -Wa,-momit-lock-prefix=yes"

PACKAGE_EXTRA_ARCHS:append = " intel-quark quark i586 x86"

INITRD_LIVE:prepend = "${DEPLOY_DIR_IMAGE}/acpi-upgrades.cpio "

IMAGE_FSTYPES += "ext4"
IMAGE_CLASSES += "qemuboot"
QB_SYSTEM_NAME = "qemu-system-i386"
QB_MEM = "-m 1024"
QB_CPU = "-cpu pentium"
QB_CPU_KVM = "-cpu pentium"
QB_KERNEL_CMDLINE_APPEND = "console=ttyS1"
QB_OPT_APPEND = "-serial pty -serial mon:stdio -device virtio-rng-pci"
