# Capa de Yocto para la Galileo / SIMATIC IOT2000 con kernel LTS moderno
#
# Nombre del proyecto : galileo-wrynose
# Licencia            : MIT (ver LICENSE)
# Autor               : José (mantenedor) · asistido por Marcelino

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "galileo-wrynose"
BBFILE_PATTERN_galileo-wrynose = "^${LAYERDIR}/"
BBFILE_PRIORITY_galileo-wrynose = "10"

# Release de Yocto: 6.0 "wrynose" (el core de 6.0 solo acepta la serie "wrynose").
# Al subir de release: cambiar esta línea, la rama y el kas-galileo.yml.
LAYERSERIES_COMPAT_galileo-wrynose = "wrynose"

LAYERDEPENDS_galileo-wrynose = "core"

# Esta capa NO redefine la máquina ni toca los strings DMI:
# renombrar "SIMATIC IOT2000" en ACPI/DMI rompe ethernet, serie y GPIO.
