# Credencial inicial de la imagen publicada: root / galileo
# CAMBIARLA en el primer acceso. Si el usuario prefiere llave, puede dejar
# galileo-keys.txt en la particion FAT de arranque y se instala esa en su lugar.
PermitRootLogin yes
PermitEmptyPasswords no
PasswordAuthentication yes
# UsePAM hace que sshd respete la contrasena expirada y pida cambiarla al
# entrar por primera vez (chage -d 0 en la receta del password).
UsePAM yes
