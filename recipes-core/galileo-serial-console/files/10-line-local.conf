# -L: modo "linea local", ignora el estado de portadora (DCD/DTR).
# Sin esto, cerrar el puerto serie hace que el shell reciba EOF, agetty lo
# relance y la consola entre en un bucle de prompts que satura el puerto.
[Service]
ExecStart=
ExecStart=-/usr/sbin/agetty -L --noreset --noclear --issue-file=/etc/issue:/etc/issue.d:/run/issue.d:/usr/lib/issue.d --keep-baud 115200,57600,38400,9600 - ${TERM}
