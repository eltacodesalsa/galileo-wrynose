# Watchdog del Quark X1000 (ie6xx_wdt) — configuración y trampas.
#
# La placa arranca con el watchdog YA ARMADO a 60 s por el firmware UEFI
# (EFI Boot Guard) y BLOQUEADO (WDT_LOCK). Tres cosas son necesarias:
#
#  1) HANDLE_BOOT_ENABLED=y  -> el core puede heredar el timer durante el arranque
#  2) que el DRIVER marque WDOG_HW_RUNNING en el probe (va en el parche, ver PATCHES.md)
#  3) NOWAYOUT=y (o nowayout por dispositivo, que es lo que hace el parche)
#
# Sin (2) el core nunca alimenta. Sin (3) el core limpia WDOG_HW_RUNNING en
# watchdog_stop() antes de llamar al driver, el driver devuelve -EBUSY (bloqueado)
# y a partir de ahí TODO ping -del demonio o del core- es un no-op silencioso:
# la placa entra en bucle de reinicio cada ~60 s sin ningún error en el log.
#
# Verificación (obligatoria, en el artefacto, no en la config):
#   strings vmlinux | grep -c 'watchdog ya en marcha'          -> 1
#   kill -9 <pid de /sbin/watchdog>  -> la placa DEBE reiniciar en <=60 s

CONFIG_WATCHDOG=y
CONFIG_WATCHDOG_CORE=y
CONFIG_IE6XX_WDT=y
CONFIG_WATCHDOG_HANDLE_BOOT_ENABLED=y
CONFIG_WATCHDOG_NOWAYOUT=y

# Cinturón de seguridad: si el userspace nunca abre /dev/watchdog (imagen rota),
# el core deja de alimentar a los 120 s en vez de para siempre, y el hardware
# reinicia -> permite que EFI Boot Guard caiga al otro slot A/B.
CONFIG_WATCHDOG_OPEN_TIMEOUT=120

# Necesario para que hw-smoke.sh pueda leer state/timeout/timeleft.
CONFIG_WATCHDOG_SYSFS=y
