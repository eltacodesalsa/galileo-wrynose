# Fragmento de configuración del kernel: hardware de la Galileo / IOT2000.
#
# Todo lo que necesita la placa para ARRANCAR y ser útil va integrado (=y) porque
# el rootfs del vendor no tiene /lib/modules del kernel nuevo. Con Yocto moderno
# los módulos sí se empaquetan, pero estos se quedan =y a propósito:
# si fallan, no hay consola ni red para diagnosticar.
#
# Validado en placa con kernel 6.12.112 (2026-10-22).

# --- arquitectura Quark X1000 (i586 sin SSE; el tune no llega al kernel) ---
CONFIG_M586TSC=y
CONFIG_X86_INTEL_QUARK=y
CONFIG_X86_MSR=y
CONFIG_X86_CPUID=y

# --- sistema de archivos raíz ---
CONFIG_EXT4_FS=y
CONFIG_EXT4_USE_FOR_EXT2=y

# --- almacenamiento: la raíz vive en microSD ---
CONFIG_MMC=y
CONFIG_MMC_SDHCI=y
CONFIG_MMC_SDHCI_PCI=y
CONFIG_MMC_BLOCK=y

# --- ethernet Quark (stmmac / intel-eth-pci) ---
CONFIG_STMMAC_ETH=y
CONFIG_STMMAC_PCI=y
CONFIG_NETDEVICES=y

# --- serial: ttyS1 es la consola del DB9; EXAR hace falta para el match ACPI ---
CONFIG_SERIAL_8250=y
CONFIG_SERIAL_8250_CONSOLE=y
CONFIG_SERIAL_8250_LPSS=y
CONFIG_SERIAL_8250_EXAR=y
CONFIG_SERIAL_8250_NR_UARTS=4

# --- bus I2C y expansores del header Arduino ---
CONFIG_I2C=y
CONFIG_I2C_CHARDEV=y
CONFIG_I2C_DESIGNWARE_PLATFORM=y
CONFIG_MFD_INTEL_QUARK_I2C_GPIO=y

# --- GPIO del header (numeración dinámica: NO asumir 0..N) ---
CONFIG_GPIOLIB=y
CONFIG_GPIO_PCA953X=y
CONFIG_GPIO_SYSFS=y
CONFIG_GPIO_CDEV=y

# --- SPI y el ADC de las entradas analógicas A0-A5 (spi-INT3495:00) ---
CONFIG_SPI=y
CONFIG_SPI_MASTER=y
CONFIG_SPI_PXA2XX=y
CONFIG_SPI_PXA2XX_PCI=y
CONFIG_SPI_SPIDEV=y
CONFIG_IIO=y
CONFIG_TI_ADC108S102=y

# --- USB (cámara, audio, adaptadores serie) ---
CONFIG_USB=y
CONFIG_USB_SUPPORT=y
CONFIG_USB_EHCI_HCD=y
CONFIG_USB_OHCI_HCD=y
CONFIG_USB_STORAGE=y
CONFIG_USB_ACM=y
CONFIG_USB_SERIAL=y
CONFIG_USB_SERIAL_FTDI_SIO=y
CONFIG_USB_SERIAL_CP210X=y
CONFIG_USB_SERIAL_CH341=y

# --- audio USB (bocina y micrófono del robot) ---
CONFIG_SOUND=y
CONFIG_SND=y
CONFIG_SND_PCM=y
CONFIG_SND_USB=y
CONFIG_SND_USB_AUDIO=y

# --- cámara USB (UVC) ---
CONFIG_MEDIA_SUPPORT=y
CONFIG_MEDIA_USB_SUPPORT=y
CONFIG_USB_VIDEO_CLASS=y
CONFIG_VIDEOBUF2_VMALLOC=y

# --- WiFi mini-PCIe Centrino 6235: IWLDVM (NO IWLMVM) ---
CONFIG_CFG80211=y
CONFIG_MAC80211=y
CONFIG_IWLWIFI=y
CONFIG_IWLDVM=y
# CONFIG_IWLMVM is not set

# --- consola de red como respaldo cuando no hay serie ---
CONFIG_NETCONSOLE=y
CONFIG_NETCONSOLE_DYNAMIC=y

# --- watchdog del Quark (ver galileo-wdt.cfg) ---
CONFIG_WATCHDOG=y
CONFIG_WATCHDOG_CORE=y
CONFIG_IE6XX_WDT=y
